name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Forbidden paths, private denylist, version consistency
        env:
          # Repository secret: newline/comma-separated regexes of former
          # branding/identifiers. Never committed to the repository.
          SAIL_DENYLIST: ${{ secrets.SAIL_DENYLIST }}
        run: python scripts/ci/check_repo_hygiene.py
      - name: No co-author / agent attribution in commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}"
          fi
          python scripts/ci/check_commit_messages.py "$range"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:latest \
            git --redact --no-banner --config /repo/.gitleaks.toml /repo

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    needs: hygiene
    env:
      SAIL_SKIP_REAL_INFERENCE: "1"
      SAIL_JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check backend tests
      - run: pytest -q --tb=short

  backend-postgres:
    name: Backend on PostgreSQL
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: sail-ci-only
          POSTGRES_DB: sail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sail" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SAIL_SKIP_REAL_INFERENCE: "1"
      SAIL_JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0000
      TEST_DATABASE_URL: postgresql+psycopg://sail:sail-ci-only@localhost:5432/sail_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/test_postgres.py tests/ -q --tb=short

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    needs: hygiene
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend class policy
        working-directory: .
        run: python3 scripts/ci/check_frontend_classes.py
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t "sail:ci-${GITHUB_SHA}" .
