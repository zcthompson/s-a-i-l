[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sail"
version = "0.0.1"
description = "S-A-I-L — open-source Sales Analytics and Intelligence Launchpad"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.0,<3",
    "aiohttp>=3.10,<4",
    "python-dotenv>=1.0,<2",
    "alembic>=1.14,<2",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "reportlab>=4.0,<5.0",
    "bcrypt>=4,<6",
    "passlib[bcrypt]>=1.7,<2",
    "psutil>=6.0,<7",
    "scipy>=1.11,<2.0",
    "pydantic-settings>=2.0,<3",
    "PyJWT>=2.8,<3",
    # Directory authentication (LDAP/AD). Pure-Python (stdlib ssl for
    # TLS/StartTLS) — no system libldap/C build, so the slim Dockerfile is
    # unchanged.
    "ldap3>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
    "pytest-asyncio>=0.24,<9",
    "pytest-cov>=5,<8",
    # ruff — CI lint gate (CI-01). Installed here so the lint job runs from
    # the project's own dependency set rather than a phantom `pip install ruff`
    # in the workflow.
    "ruff>=0.17,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_inference: test calls a live model endpoint; skipped when SAIL_SKIP_REAL_INFERENCE=1 (e.g. GitHub CI)",
]


[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
# CI-01: blocking lint gate (ruff runs from the project's own dev extras).
# Selects are the safe, behavior-neutral subset: pyflakes (F), a curated set
# of pycodestyle (E/W), and isort (I).
select = ["E401", "E402", "E702", "E713", "E741", "E742", "F401", "F402", "F403", "F405", "F503", "F541", "F811", "F821", "F841", "W605", "I001"]

[tool.ruff.lint.per-file-ignores]
# Test-local variables are intentional (fixtures/scratch state).
"tests/backend/test_*.py" = ["F841"]
# backend/main.py loads .env BEFORE importing app modules — imports-after-code
# is the required order (E402 is intentional, not a lint debt).
"backend/main.py" = ["E402"]
# Test setup (env vars / monkeypatches / engine bootstrap) must run before
# backend modules import — imports-after-code is intentional here too.
"tests/backend/conftest.py" = ["E402"]
"tests/backend/test_auth.py" = ["E402"]
"tests/backend/test_multi_tenant_isolation.py" = ["E402"]
"tests/backend/test_frontend_contract.py" = ["E402"]
